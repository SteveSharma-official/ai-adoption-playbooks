# Series-wide check. Status: STATICALLY VALIDATED (actionlint); EXECUTION VALIDATION REQUIRED on a hosted runner.
# Submodules are public-repository URLs; if a book repository is private, add a read-only token as a repository secret.
# Before publication: pin each action to a full commit SHA.
name: series-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_series.py --run-tests
